<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Inventory Scanner POC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1220; color: #f8fafc; min-height: 100vh;
    }
    main { max-width: 680px; margin: auto; padding: 18px; }
    h1 { font-size: 1.45rem; margin: 6px 0 4px; }
    .sub { color: #94a3b8; margin: 0 0 16px; }
    .card {
      background: #111827; border: 1px solid #334155; border-radius: 16px;
      padding: 14px; margin-bottom: 14px;
    }
    video {
      display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover;
      background: #000; border-radius: 12px;
    }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    button {
      min-height: 48px; border: 0; border-radius: 12px; font-size: 1rem;
      font-weight: 700; padding: 10px 12px;
    }
    .primary { background: #f8fafc; color: #0f172a; }
    .secondary { background: #334155; color: #f8fafc; }
    .status { margin-top: 12px; color: #cbd5e1; line-height: 1.35; }
    .result {
      font-size: 2rem; font-weight: 800; overflow-wrap: anywhere;
      padding: 18px 8px; text-align: center;
    }
    .good { border-color: #22c55e; }
    .bad { border-color: #ef4444; }
    .label { color: #94a3b8; font-size: .85rem; text-transform: uppercase; letter-spacing: .08em; }
    input {
      width: 100%; min-height: 46px; margin-top: 8px; border-radius: 10px;
      border: 1px solid #475569; padding: 10px; font-size: 1rem;
      background: #0f172a; color: white;
    }
    code { color: #e2e8f0; }
  </style>
</head>
<body>
<main>
  <h1>Inventory Scanner POC</h1>
  <p class="sub">iPhone / Safari test • expected marker: <strong>BIN-A04</strong></p>

  <section class="card">
    <video id="video" playsinline muted></video>
    <div class="buttons">
      <button class="primary" id="start">Start Camera</button>
      <button class="secondary" id="stop">Stop</button>
    </div>
    <div class="status" id="status">Camera not started.</div>
  </section>

  <section class="card" id="resultCard">
    <div class="label">Last scanned value</div>
    <div class="result" id="result">—</div>
  </section>

  <section class="card">
    <div class="label">Manual fallback</div>
    <input id="manual" value="BIN-A04" autocapitalize="characters">
    <button class="secondary" id="submit" style="width:100%;margin-top:10px">Submit Marker</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(() => {
  const EXPECTED = "BIN-A04";
  const video = document.getElementById("video");
  const status = document.getElementById("status");
  const result = document.getElementById("result");
  const resultCard = document.getElementById("resultCard");
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  let stream = null, running = false, lastValue = "", lastTime = 0;

  function report(value) {
    value = String(value || "").trim();
    if (!value) return;
    result.textContent = value;
    resultCard.classList.remove("good", "bad");
    const ok = value.toUpperCase() === EXPECTED;
    resultCard.classList.add(ok ? "good" : "bad");
    status.textContent = ok
      ? "✓ Correct marker. Expected " + EXPECTED + "."
      : "✗ Wrong marker. Expected " + EXPECTED + ".";
    if (navigator.vibrate) navigator.vibrate(ok ? 100 : [80,60,80]);
  }

  async function startCamera() {
    try {
      if (!window.isSecureContext) {
        status.textContent = "This page is not a secure HTTPS context.";
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        status.textContent = "Camera API unavailable in this browser.";
        return;
      }
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: "environment" } }
      });
      video.srcObject = stream;
      await video.play();
      running = true;
      status.textContent = "Camera active. Point it at a QR code.";
      requestAnimationFrame(scan);
    } catch (err) {
      status.textContent = "Camera error: " + (err.name || "Error") + " — " + (err.message || err);
    }
  }

  function stopCamera() {
    running = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    video.srcObject = null;
    status.textContent = "Camera stopped.";
  }

  function scan(now) {
    if (!running) return;
    if (video.readyState >= 2 && video.videoWidth && video.videoHeight && now - lastTime > 120) {
      lastTime = now;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      if (typeof jsQR === "function") {
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert"
        });
        if (code && code.data && code.data !== lastValue) {
          lastValue = code.data;
          report(code.data);
          setTimeout(() => { lastValue = ""; }, 1200);
        }
      } else {
        status.textContent = "QR decoder did not load. Check internet access and reload.";
      }
    }
    requestAnimationFrame(scan);
  }

  document.getElementById("start").addEventListener("click", startCamera);
  document.getElementById("stop").addEventListener("click", stopCamera);
  document.getElementById("submit").addEventListener("click", () => {
    report(document.getElementById("manual").value);
  });
  window.addEventListener("pagehide", stopCamera);
})();
</script>
</body>
</html>
