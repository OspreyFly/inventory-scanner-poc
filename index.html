<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>Guided Pick AR POC</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#05070b;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:14px}
h1{font-size:1.3rem;margin:5px 0}
p{color:#aeb8c8;margin:4px 0 12px}
.camera{position:relative;width:100%;overflow:hidden;border-radius:16px;background:#000;aspect-ratio:3/4;border:1px solid #293241}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
canvas{pointer-events:none}
.panel{background:#111722;border:1px solid #293241;border-radius:14px;padding:12px;margin-top:12px}
.row{display:flex;gap:8px}
button,select{min-height:46px;border:0;border-radius:11px;font-size:1rem;font-weight:700;padding:9px 12px}
button{flex:1;background:white;color:#10151e}
button.alt{background:#303b4d;color:white}
select{width:100%;background:#202938;color:white;border:1px solid #435067}
.label{font-size:.78rem;color:#91a0b5;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
#status{font-weight:700;margin-top:10px;line-height:1.35}
.hint{font-size:.88rem;color:#91a0b5;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>Guided Pick — AR Marker POC</h1>
<p>Choose a target bin, start the camera, then look across your QR labels.</p>

<div class="camera" id="cameraBox">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<div class="panel">
  <div class="label">Target location</div>
  <select id="target">
    <option>BIN-A01</option><option>BIN-A02</option><option>BIN-A03</option>
    <option selected>BIN-A04</option><option>BIN-A05</option>
    <option>BIN-B01</option><option>BIN-B02</option><option>BIN-B03</option>
    <option>BIN-B04</option><option>BIN-B05</option>
  </select>
  <div class="row" style="margin-top:10px">
    <button id="start">Start Camera</button>
    <button id="stop" class="alt">Stop</button>
  </div>
  <div id="status">Camera not started.</div>
  <div class="hint">The app highlights only the selected bin. Move the camera slowly across the labels.</div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(() => {
 const video=document.getElementById('video');
 const overlay=document.getElementById('overlay');
 const octx=overlay.getContext('2d');
 const scanCanvas=document.createElement('canvas');
 const sctx=scanCanvas.getContext('2d',{willReadFrequently:true});
 const status=document.getElementById('status');
 const target=document.getElementById('target');
 let stream=null,running=false,lastScan=0,foundUntil=0,lastLoc=null;

 function resizeOverlay(){
   const r=video.getBoundingClientRect();
   const dpr=window.devicePixelRatio||1;
   overlay.width=Math.round(r.width*dpr);
   overlay.height=Math.round(r.height*dpr);
   octx.setTransform(dpr,0,0,dpr,0,0);
 }
 function mapPoint(p){
   // Video uses object-fit: cover. Map source pixels to displayed CSS pixels.
   const vw=video.videoWidth,vh=video.videoHeight;
   const box=video.getBoundingClientRect();
   const scale=Math.max(box.width/vw,box.height/vh);
   const shownW=vw*scale, shownH=vh*scale;
   const cropX=(shownW-box.width)/2, cropY=(shownH-box.height)/2;
   return {x:p.x*scale-cropX,y:p.y*scale-cropY};
 }
 function drawMarker(loc,label){
   resizeOverlay();
   const pts=[loc.topLeftCorner,loc.topRightCorner,loc.bottomRightCorner,loc.bottomLeftCorner].map(mapPoint);
   const cx=pts.reduce((a,p)=>a+p.x,0)/4;
   const cy=pts.reduce((a,p)=>a+p.y,0)/4;
   const top=Math.min(...pts.map(p=>p.y));
   const left=Math.min(...pts.map(p=>p.x));
   const right=Math.max(...pts.map(p=>p.x));
   const bottom=Math.max(...pts.map(p=>p.y));
   const w=right-left,h=bottom-top;

   octx.clearRect(0,0,overlay.clientWidth,overlay.clientHeight);

   // QR outline
   octx.lineWidth=5;
   octx.strokeStyle='#39ff88';
   octx.shadowColor='#000';
   octx.shadowBlur=8;
   octx.strokeRect(left-8,top-8,w+16,h+16);
   octx.shadowBlur=0;

   // Arrow positioned above the QR
   const tipY=Math.max(30,top-18);
   const head=18;
   const shaftTop=Math.max(14,tipY-78);
   octx.strokeStyle='#39ff88';
   octx.fillStyle='#39ff88';
   octx.lineWidth=10;
   octx.lineCap='round';
   octx.beginPath(); octx.moveTo(cx,shaftTop); octx.lineTo(cx,tipY-head); octx.stroke();
   octx.beginPath();
   octx.moveTo(cx,tipY);
   octx.lineTo(cx-head,tipY-head-3);
   octx.lineTo(cx+head,tipY-head-3);
   octx.closePath(); octx.fill();

   // Label bubble
   const text='PICK HERE • '+label;
   octx.font='bold 16px -apple-system, sans-serif';
   const tw=octx.measureText(text).width;
   const bx=Math.max(6,Math.min(overlay.clientWidth-tw-26,cx-tw/2-13));
   const by=Math.max(5,shaftTop-34);
   octx.fillStyle='rgba(0,0,0,.82)';
   octx.fillRect(bx,by,tw+26,28);
   octx.fillStyle='#fff';
   octx.fillText(text,bx+13,by+20);
 }

 function clearMarker(){
   resizeOverlay();
   octx.clearRect(0,0,overlay.clientWidth,overlay.clientHeight);
 }

 async function start(){
   try{
     if(!window.isSecureContext){status.textContent='HTTPS secure context required.';return;}
     stream=await navigator.mediaDevices.getUserMedia({
       audio:false, video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}
     });
     video.srcObject=stream;
     await video.play();
     running=true;
     status.textContent='Searching for '+target.value+'…';
     requestAnimationFrame(loop);
   }catch(e){status.textContent='Camera error: '+e.name+' — '+e.message;}
 }
 function stop(){
   running=false;
   if(stream)stream.getTracks().forEach(t=>t.stop());
   stream=null;video.srcObject=null;clearMarker();status.textContent='Camera stopped.';
 }
 function loop(t){
   if(!running)return;
   if(video.readyState>=2 && t-lastScan>100){
     lastScan=t;
     const vw=video.videoWidth,vh=video.videoHeight;
     if(vw&&vh){
       // Downscale moderately for speed while retaining enough detail for distance tests.
       const maxW=960;
       const scale=Math.min(1,maxW/vw);
       scanCanvas.width=Math.round(vw*scale);
       scanCanvas.height=Math.round(vh*scale);
       sctx.drawImage(video,0,0,scanCanvas.width,scanCanvas.height);
       const im=sctx.getImageData(0,0,scanCanvas.width,scanCanvas.height);
       const code=typeof jsQR==='function'?jsQR(im.data,im.width,im.height,{inversionAttempts:'dontInvert'}):null;
       if(code && code.data){
         // Convert decoder coordinates back to native video coordinates.
         const inv=1/scale;
         const loc={};
         for(const k of ['topLeftCorner','topRightCorner','bottomRightCorner','bottomLeftCorner']){
           loc[k]={x:code.location[k].x*inv,y:code.location[k].y*inv};
         }
         if(code.data.trim().toUpperCase()===target.value){
           lastLoc=loc;foundUntil=t+350;
           drawMarker(loc,target.value);
           status.textContent='✓ TARGET FOUND: '+target.value;
         }else{
           status.textContent='Saw '+code.data+' — still looking for '+target.value+'…';
         }
       }
       if(t>foundUntil){
         lastLoc=null;clearMarker();
         if(!code)status.textContent='Searching for '+target.value+'…';
       }
     }
   } else if(lastLoc && t<=foundUntil) drawMarker(lastLoc,target.value);
   requestAnimationFrame(loop);
 }
 target.addEventListener('change',()=>{foundUntil=0;lastLoc=null;clearMarker();status.textContent=running?'Searching for '+target.value+'…':'Target set to '+target.value+'.';});
 document.getElementById('start').onclick=start;
 document.getElementById('stop').onclick=stop;
 window.addEventListener('resize',()=>{if(lastLoc)drawMarker(lastLoc,target.value);});
 window.addEventListener('pagehide',stop);
})();
</script>
</body>
</html>
